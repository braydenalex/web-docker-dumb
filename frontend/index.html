<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web-docker-dumb</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>
  <div class="dashboard-grid">
    <aside id="sidebar" class="sidebar-nav" aria-labelledby="sidebarTitle">
      <div class="sidebar-header">
        <span id="sidebarTitle" class="brand">web-docker-<span>dumb</span></span>
        <button id="closeSidebar" class="icon-button drawer-control" type="button" aria-label="Close containers menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <nav class="sidebar-content" aria-label="Containers">
        <ul id="sidebarList" class="nav-list"></ul>
      </nav>
      <div id="sidebarResizer" class="resizer" aria-hidden="true"></div>
    </aside>

    <main id="mainContent" class="content-wrapper">
      <header class="top-bar">
        <button id="hamburgerBtn" class="icon-button drawer-control" type="button"
                aria-label="Open containers menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>Containers</h1>
        <div class="header-controls">
          <button id="refresh" class="button refresh-button" type="button" aria-label="Refresh container list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 0 0-13.7-2.6L4 8m0 0h5M4 8V3m0 13a8 8 0 0 0 13.7 2.6L20 16m0 0h-5m5 0v5"/></svg>
            Refresh
          </button>
          <button class="icon-button" type="button" popovertarget="refreshSettings" aria-label="Refresh settings" title="Refresh settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4m4 0h8M4 17h8m4 0h4"/><circle cx="10" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>
          </button>
        </div>
        <div id="refreshSettings" class="refresh-settings" popover>
          <label class="settings-row"><span>Automatic refresh</span><input id="autoRefreshToggle" type="checkbox" checked></label>
          <label class="settings-row" for="refreshInterval">
            <span>Interval in minutes</span>
            <input id="refreshInterval" type="number" value="2" min="1" max="120">
          </label>
        </div>
      </header>

      <div id="contentArea">
        <p id="refreshStatus" class="refresh-status" role="status">Loading containers…</p>
        <p id="messageBar" class="message-bar" role="status"></p>
        <section id="summaryView" aria-label="All containers">
          <div class="summary-tools">
            <label class="search-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
              <span class="sr-only">Search by container name or image</span>
              <input id="containerSearch" type="search" placeholder="Search by name or image" autocomplete="off" disabled>
            </label>
          </div>
          <div id="containerGroups"></div>
        </section>

        <section id="detailView" aria-labelledby="containerName" hidden>
          <button id="backBtn" class="text-button" type="button">← All containers</button>
          <div class="detail-panel">
            <div class="detail-heading">
              <div>
                <h2 id="containerName" tabindex="-1"></h2>
                <p id="containerImage" class="detail-image"></p>
              </div>
              <span id="containerStatus" class="state-label"></span>
            </div>
            <div class="container-actions">
              <button id="startContainer" class="button action-start" type="button">Start</button>
              <button id="stopContainer" class="button action-stop" type="button">Stop</button>
              <button id="viewLogs" class="button" type="button" aria-controls="logsContainer" aria-expanded="false">View logs</button>
            </div>
          </div>
          <section id="logsContainer" class="logs-container" aria-labelledby="logsTitle" hidden>
            <header class="log-header">
              <div>
                <h3 id="logsTitle">Logs</h3>
                <div id="logLimit" class="log-limit" hidden></div>
              </div>
              <div class="log-toolbar" role="group" aria-label="Log controls">
                <button id="refreshLogs" class="button" type="button">Refresh logs</button>
                <button id="copyLogs" class="button" type="button" disabled>Copy</button>
                <button id="downloadLogs" class="button" type="button" disabled>Download</button>
              </div>
            </header>
            <p id="logStatus" class="log-status" role="status"></p>
            <pre id="logsOutput" tabindex="0" aria-label="Container log output"></pre>
            <div class="log-display-controls" role="group" aria-label="Log display">
              <button id="wrapLogs" class="button" type="button" aria-pressed="true">Wrap</button>
              <button id="smallerLogs" class="button" type="button" aria-label="Smaller log text">A−</button>
              <button id="largerLogs" class="button" type="button" aria-label="Larger log text">A+</button>
              <button id="fullscreenLogs" class="button" type="button" aria-pressed="false">Fullscreen</button>
            </div>
          </section>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
